name: Build Cal.diy + Razorpay (linux/amd64)

# Native amd64 build for the Rex Business Growth VPS (x86_64).
# Cross-building this on an arm64 Mac under QEMU fails: sqlite3,
# msgpackr-extract, deasync and the root workspace postinstall all fail
# to compile under emulation.

on:
  workflow_dispatch:
  push:
    branches: [rex-razorpay]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Reclaim runner disk
        # The image is ~8GB and the runner ships with ~14GB free.
        run: |
          df -h / | tail -1
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/lib/android \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          sudo docker image prune -af || true
          echo "after cleanup:"
          df -h / | tail -1

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          provenance: false
          tags: |
            ghcr.io/${{ github.repository }}:176037d-rzp1
            ghcr.io/${{ github.repository }}:latest
          build-args: |
            DATABASE_URL=postgresql://placeholder:placeholder@localhost:5432/placeholder
            NEXTAUTH_SECRET=buildtime-placeholder
            CALENDSO_ENCRYPTION_KEY=buildtime-placeholder
            CALCOM_TELEMETRY_DISABLED=1
            MAX_OLD_SPACE_SIZE=6144

      - name: Report image
        run: |
          echo "Pushed: ghcr.io/${{ github.repository }}:176037d-rzp1"
          df -h / | tail -1
